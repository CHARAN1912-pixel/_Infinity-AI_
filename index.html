<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity AI</title>
    <!-- Web App Manifest embedded for Chrome / Mobile Installation -->
    <link rel="manifest" href="data:application/manifest+json,{
        %22name%22: %22Infinity AI%22,
        %22short_name%22: %22Infinity%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23ffffff%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: [{
            %22src%22: %221000032296.png%22,
            %22sizes%22: %22512x512%22,
            %22type%22: %22image/png%22
        }]
    }">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="1000032296.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS & JS for proper math symbol rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 h-screen flex overflow-hidden selection:bg-blue-100 selection:text-blue-900">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-[#f0f4f9] border-r border-slate-200/80 flex flex-col justify-between transition-transform duration-200 ease-in-out -translate-x-full md:translate-x-0">
        <div>
            <!-- Sidebar Header / App Branding -->
            <div class="p-4 flex flex-col gap-3">
                <div class="flex items-center gap-2.5 px-2">
                    <img src="1000032296.png" alt="Infinity AI Logo" class="w-8 h-8 rounded-xl object-cover shadow-sm">
                    <span class="font-bold text-slate-900 tracking-tight text-sm">Infinity AI</span>
                </div>
                
                <button onclick="startNewChat()" class="w-full bg-[#dde3ea] hover:bg-[#d0d7e2] text-slate-700 px-4 py-3 rounded-full font-medium text-sm flex items-center gap-3 transition-colors shadow-sm cursor-pointer">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New chat
                </button>
                
                <!-- Install App Button -->
                <button id="install-btn" style="display: none;" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-full font-medium text-xs flex items-center justify-center gap-2 transition-colors shadow-sm cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Install App
                </button>
            </div>

            <!-- Recent History -->
            <div class="px-4 py-2">
                <div class="text-xs font-semibold text-slate-500 uppercase px-3 mb-2 tracking-wider">Recent</div>
                <div id="history-list" class="space-y-1">
                    <div class="text-xs text-slate-400 px-3 py-2 italic">No recent chats</div>
                </div>
            </div>
        </div>

        <!-- Sidebar Footer / Creator -->
        <div class="p-4 border-t border-slate-200/60 bg-[#f0f4f9]">
            <div class="flex items-center justify-between px-3 py-2 bg-white/60 rounded-2xl border border-slate-200/60 shadow-sm">
                <div class="flex items-center gap-2.5">
                    <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold text-white">C</div>
                    <div>
                        <div class="text-[10px] text-slate-500 font-medium leading-none">Creator</div>
                        <div class="text-xs font-bold text-slate-800">CHARAN</div>
                    </div>
                </div>
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            </div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col h-full md:pl-72 relative bg-white">

        <!-- Top Nav Bar -->
        <header class="h-16 border-b border-slate-100 bg-white/90 backdrop-blur-md flex items-center justify-between px-6 z-20 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 p-2 rounded-xl hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-2 font-semibold text-lg text-slate-800 tracking-tight">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600">✨ Infinity AI</span>
                </div>
            </div>
            <div>
                <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase bg-slate-100 px-3 py-1 rounded-full">POWERED BY CHARAN</span>
            </div>
        </header>

        <!-- Viewport -->
        <main id="chat-viewport" class="flex-1 overflow-y-auto relative flex flex-col">
            
            <!-- Hero Welcome Screen -->
            <div id="hero-state" class="m-auto max-w-2xl w-full p-6 text-left my-auto">
                <div class="mb-4">
                    <img src="1000032296.png" alt="Logo" class="w-16 h-16 rounded-2xl shadow-md object-cover">
                </div>
                <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent mb-2">Hello, there</h1>
                <p class="text-4xl font-semibold text-slate-300 mb-8">How can I help you today?</p>
                
                <!-- Prompt suggestion grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button onclick="sendQuickPrompt('Explain quantum computing simply')" class="p-4 rounded-2xl bg-[#f0f4f9] hover:bg-[#e2e8f0] transition-colors text-xs text-slate-700 flex items-center justify-between group">
                        <span>⚛️ Explain quantum computing simply</span>
                        <span class="text-slate-400 group-hover:translate-x-0.5 transition-transform">→</span>
                    </button>
                    <button onclick="sendQuickPrompt('Who created you?')" class="p-4 rounded-2xl bg-[#f0f4f9] hover:bg-[#e2e8f0] transition-colors text-xs text-slate-700 flex items-center justify-between group">
                        <span>✨ Who created you?</span>
                        <span class="text-slate-400 group-hover:translate-x-0.5 transition-transform">→</span>
                    </button>
                </div>
            </div>

            <!-- Messages Thread -->
            <div id="messages-container" class="max-w-3xl w-full mx-auto p-4 md:p-6 space-y-6 hidden pb-36">
                <!-- Messages appended dynamically -->
            </div>
        </main>

        <!-- Floating Input Footer -->
        <footer class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white/90 to-transparent pt-6 pb-6 px-4 z-20">
            <div class="max-w-3xl mx-auto flex flex-col gap-2">
                
                <!-- File/Image Preview Tag if attached -->
                <div id="file-preview-container" class="hidden items-center gap-2 bg-[#f0f4f9] border border-slate-200 px-3 py-1.5 rounded-2xl w-fit">
                    <span id="file-name" class="text-xs text-slate-700 font-medium truncate max-w-xs">Attached File</span>
                    <button onclick="clearFile()" class="text-slate-400 hover:text-red-500 font-bold text-xs">×</button>
                </div>

                <form id="chat-form" class="bg-[#f0f4f9] border border-slate-200/80 rounded-3xl p-3 shadow-sm focus-within:border-blue-500 focus-within:bg-white transition-all">
                    <textarea 
                        id="user-input" 
                        rows="1"
                        placeholder="Enter a prompt here..." 
                        class="w-full bg-transparent text-slate-800 placeholder:text-slate-400 text-sm px-3 py-2 focus:outline-none resize-none max-h-36"
                        required
                    ></textarea>
                    
                    <div class="flex items-center justify-between pt-2 px-2 border-t border-slate-200/60 mt-1">
                        <div class="flex items-center gap-2">
                            <!-- File/Image Attachment Button -->
                            <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer select-none bg-white border border-slate-200 px-3 py-1.5 rounded-full shadow-sm hover:bg-slate-50 transition-colors">
                                <input type="file" id="file-input" accept="image/*,.txt,.pdf,.js,.py,.html" class="hidden" onchange="handleFileSelect(event)">
                                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                                <span id="attach-label">Add image or file</span>
                            </label>
                        </div>

                        <button 
                            type="submit" 
                            id="send-btn"
                            class="bg-blue-600 hover:bg-blue-700 text-white w-9 h-9 rounded-full flex items-center justify-center transition-all shadow-md shadow-blue-600/20 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed active:scale-95"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        </button>
                    </div>
                </form>
                <div class="text-center">
                    <span class="text-[10px] tracking-widest font-semibold text-slate-400 uppercase">POWERED BY CHARAN</span>
                </div>
            </div>
        </footer>

    </div>

    <!-- Modal Dialog -->
    <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 max-w-md w-full shadow-2xl">
            <h3 id="modal-title" class="text-base font-bold mb-2 text-slate-900">Notice</h3>
            <p id="modal-message" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-medium text-sm transition-all shadow-md shadow-blue-600/20">OK</button>
        </div>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        });

        const chatViewport = document.getElementById('chat-viewport');
        const heroState = document.getElementById('hero-state');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sidebar = document.getElementById('sidebar');
        const modal = document.getElementById('modal');
        const modalMessage = document.getElementById('modal-message');
        const historyList = document.getElementById('history-list');
        const fileInput = document.getElementById('file-input');
        const filePreviewContainer = document.getElementById('file-preview-container');
        const fileName = document.getElementById('file-name');

        let chatActive = false;
        let attachedFileData = null;
        let attachedMimeType = null;

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
        }

        function showModal(msg) {
            modalMessage.textContent = msg;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function startNewChat() {
            messagesContainer.innerHTML = '';
            messagesContainer.classList.add('hidden');
            heroState.classList.remove('hidden');
            chatActive = false;
            clearFile();
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function sendQuickPrompt(promptText) {
            userInput.value = promptText;
            chatForm.dispatchEvent(new Event('submit'));
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            attachedMimeType = file.type || 'text/plain';
            
            reader.onload = function(e) {
                if (attachedMimeType.startsWith('image/')) {
                    attachedFileData = e.target.result.split(',')[1];
                } else {
                    attachedFileData = e.target.result;
                }
                fileName.textContent = file.name;
                filePreviewContainer.classList.remove('hidden');
                filePreviewContainer.classList.add('flex');
            };

            if (attachedMimeType.startsWith('image/')) {
                reader.readAsDataURL(file);
            } else {
                reader.readAsText(file);
            }
        }

        function clearFile() {
            attachedFileData = null;
            attachedMimeType = null;
            fileInput.value = '';
            filePreviewContainer.classList.remove('flex');
            filePreviewContainer.classList.add('hidden');
        }

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function addHistoryItem(title) {
            if (historyList.querySelector('.italic')) {
                historyList.innerHTML = '';
            }
            const item = document.createElement('div');
            item.className = 'text-xs text-slate-600 px-3 py-2.5 rounded-xl hover:bg-[#e2e8f0] cursor-pointer truncate transition-colors';
            item.textContent = title;
            historyList.prepend(item);
        }

        // Clean markdown formatter
        function formatMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900">$1</strong>')
                .replace(/^\* (.*$)/gm, '<li class="ml-4 list-disc">$1</li>')
                .replace(/^\d+\. (.*$)/gm, '<li class="ml-4 list-decimal">$1</li>')
                .replace(/\n/g, '<br>');
        }

        function appendMessage(sender, text) {
            if (!chatActive) {
                heroState.classList.add('hidden');
                messagesContainer.classList.remove('hidden');
                chatActive = true;
                addHistoryItem(userInput.value || "Conversation");
            }

            const isUser = sender === 'user';
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex gap-4 items-start ${isUser ? 'justify-end' : ''}`;

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-xs text-white shrink-0 shadow-sm';
                avatar.textContent = '✨';
                messageWrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-3xl max-w-[85%] text-sm leading-relaxed ${
                isUser 
                ? 'bg-[#f0f4f9] text-slate-800 rounded-tr-sm' 
                : 'bg-white text-slate-800 w-full space-y-1'
            }`;
            
            bubble.innerHTML = formatMarkdown(text);
            messageWrapper.appendChild(bubble);

            messagesContainer.appendChild(messageWrapper);
            chatViewport.scrollTop = chatViewport.scrollHeight;

            // Trigger KaTeX math rendering on newly added messages
            if (window.renderMathInElement) {
                renderMathInElement(bubble, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        async function callGemini(prompt, fileData, mimeType, retries = 3, delay = 500) {
            const apiKey = "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            let parts = [];
            if (fileData) {
                if (mimeType && mimeType.startsWith('image/')) {
                    parts.push({
                        inlineData: {
                            mimeType: mimeType,
                            data: fileData
                        }
                    });
                    parts.push({ text: prompt || "Analyze this image." });
                } else {
                    parts.push({ text: `File Content:\n${fileData}\n\nUser Prompt: ${prompt}` });
                }
            } else {
                parts.push({ text: prompt });
            }

            const payload = {
                contents: [{ role: "user", parts: parts }],
                systemInstruction: { 
                    parts: [{ 
                        text: "You are Infinity AI, an elite assistant. Only if the user explicitly asks who created you, who made you, or who built you, answer that you were created by CHARAN. Otherwise, respond naturally and directly without mentioning creators. Keep formatting clean and concise." 
                    }] 
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("No response generated.");
                    return text;
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const currentFile = attachedFileData;
            const currentMime = attachedMimeType;

            if (!text && !currentFile) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.disabled = true;
            sendBtn.disabled = true;
            clearFile();

            appendMessage('user', text || "[Attached File]");

            const typingId = 'typing-' + Date.now();
            const typingWrapper = document.createElement('div');
            typingWrapper.id = typingId;
            typingWrapper.className = 'flex gap-4 items-start';
            typingWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-bold text-xs text-white shrink-0 shadow-sm">✨</div>
                <div class="bg-white text-slate-500 p-4 rounded-3xl rounded-tl-sm text-sm flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></span>
                    <span class="w-2 h-2 rounded-full bg-blue-600 animate-bounce" style="animation-delay: 0.15s;"></span>
                    <span class="w-2 h-2 rounded-full bg-blue-600 animate-bounce" style="animation-delay: 0.3s;"></span>
                </div>
            `;
            messagesContainer.appendChild(typingWrapper);
            chatViewport.scrollTop = chatViewport.scrollHeight;

            try {
                const aiResponse = await callGemini(text, currentFile, currentMime);
                document.getElementById(typingId).remove();
                appendMessage('ai', aiResponse);
            } catch (err) {
                document.getElementById(typingId)?.remove();
                showModal("Connection timeout or error. Please check your network connection.");
                appendMessage('ai', "Error connecting to AI service.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
